AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  ProjectName:
    Type: String
    Default: payment-demo

  Environment:
    Type: String

  Capacity:
    Type: Number

  RefillRate:
    Type: Number

  MemorySize:
    Type: Number

  Timeout:
    Type: Number

  LogRetentionDays:
    Type: Number

  CacheArn:
    Type: String

  CacheName:
    Type: String

  CacheEndpoint:
    Type: String

  ValKeyUserArn:
    Type: String

  ValKeyUserName:
    Type: String

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  PolicyTableName:
    Type: String

  PolicyTableArn:
    Type: String

  ReservedConcurrency:
    Type: Number
    Default: 0
    Description: >
      Reserved Lambda concurrency. 0 means use account-level
      unreserved concurrency.

Conditions:
  UseReservedConcurrency: !Not
    - !Equals
      - !Ref ReservedConcurrency
      - 0

Resources:
  #########################################
  # Lambda Execution Role
  #########################################

  PaymentDemoLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: LambdaLogging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Environment}-${ProjectName}-rate-limiter:*"

        - PolicyName: LambdaVpcNetworking
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"

        - PolicyName: ElastiCacheIAMAuth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - elasticache:Connect
                Resource:
                  - !Ref CacheArn
                  - !Ref ValKeyUserArn

        - PolicyName: XrayTelemetryAuth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

        - PolicyName: RateLimitPolicyRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !Ref PolicyTableArn

  #########################################
  # Lambda Function
  #########################################

  PaymentDemoRateLimiter:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-${ProjectName}-rate-limiter"
      ReservedConcurrentExecutions: !If
        - UseReservedConcurrency
        - !Ref ReservedConcurrency
        - !Ref AWS::NoValue
      CodeUri: ../src/RateLimiter
      Handler: lambda_fn.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Role:
        !GetAtt PaymentDemoLambdaExecutionRole.Arn
      Environment:
        Variables:
          CAPACITY: !Ref Capacity
          REFILL_RATE: !Ref RefillRate
          VALKEY_USER: !Ref ValKeyUserName
          CACHE_NAME: !Ref CacheName
          ELASTICACHE_HOST: !Ref CacheEndpoint
          ENVIRONMENT: !Ref Environment
          POLICY_TABLE_NAME: !Ref PolicyTableName
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          !Ref PrivateSubnetIds

  PaymentDemoRateLimiterLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: PaymentDemoRateLimiter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-${ProjectName}-rate-limiter"
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  LambdaFunction:
    Description: Lambda function name
    Value:
      !Ref PaymentDemoRateLimiter

  LambdaFunctionArn:
    Value: !GetAtt PaymentDemoRateLimiter.Arn