AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String

  ProjectName:
    Type: String

  RetentionInDays:
    Type: Number

Resources:
  #########################################################
  # API Gateway CloudWatch Logging Role
  #########################################################

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role

    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  #########################################################
  # API Access Logs
  #########################################################

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref RetentionInDays
      LogGroupName: !Sub "/aws/apigateway/${Environment}-${ProjectName}"

Outputs:
  ApiAccessLog:
    Value: !GetAtt ApiAccessLogs.Arn

  CloudWatchRoleArn:
    Value: !GetAtt ApiGatewayCloudWatchRole.Arn
