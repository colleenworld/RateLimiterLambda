AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: API Gateway for the Payment Demo

Parameters:
  Environment:
    Type: String

  ProjectName:
    Type: String

  LambdaFunctionArn:
    Type: String

  ApiAccessLogArn:
    Type: String

  ApiCloudWatchRoleArn:
    Type: String

Resources:

  #########################################################
  # API Gateway Account Settings
  #########################################################

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !Ref ApiCloudWatchRoleArn

  #########################################################
  # REST API
  #########################################################

  GatewayApi:
    Type: AWS::Serverless::Api
    DependsOn:
      - ApiGatewayAccount
    Properties:
      Name: !Sub "${Environment}-${ProjectName}"
      StageName: v1
      EndpointConfiguration:
        Type: REGIONAL
      OpenApiVersion: 3.0.1
      TracingEnabled: true
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"

      #################################################################
      # OpenAPI definition
      #################################################################

      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Payment Demo API
          version: "1.0"
        paths:
          /check:
            post:
              summary: Check rate limit
              responses:
                "200":
                  description: Request allowed
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          ok:
                            type: boolean
                          remaining:
                            type: number

                "429":
                  description: Rate limit exceeded
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          error:
                            type: string
                          remaining:
                            type: number
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunctionArn}/invocations

      #################################################################
      # Stage settings
      #################################################################

      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false

      AccessLogSetting:
        DestinationArn: !Ref ApiAccessLogArn
        Format: '{"requestId":"$context.requestId","status":"$context.status","integrationStatus":"$context.integration.status","integrationError":"$context.integrationErrorMessage","integrationLatency":"$context.integrationLatency","responseLatency":"$context.responseLatency"}'

  #########################################################
  # Allow API Gateway to invoke the Lambda
  #########################################################

  RateLimiterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GatewayApi}/*/POST/check"
Outputs:
  ApiId:
    Description: REST API Id
    Value: !Ref GatewayApi

  ApiUrl:
    Description: Invoke URL
    Value: !Sub >-
      https://${GatewayApi}.execute-api.${AWS::Region}.amazonaws.com/v1/