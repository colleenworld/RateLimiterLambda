name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v3

      - name: Validate deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          APPLICATION_STACK_NAME: ${{ vars.APPLICATION_STACK_NAME }}
          SAM_ARTIFACT_BUCKET: ${{ vars.SAM_ARTIFACT_BUCKET }}
          CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
        run: |
          for var in \
            AWS_DEPLOY_ROLE_ARN \
            AWS_REGION \
            APPLICATION_STACK_NAME \
            SAM_ARTIFACT_BUCKET \
            CLOUDFORMATION_EXECUTION_ROLE_ARN
          do
            if [ -z "${!var}" ]; then
              echo "::error::$var repository variable is not configured"
              exit 1
            fi
          done

          echo "Deployment configuration is present"
      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString()
            );

            core.info(`OIDC sub: ${payload.sub}`);
            core.info(`OIDC aud: ${payload.aud}`);
            core.info(`OIDC repository: ${payload.repository}`);
            core.info(`OIDC repository_id: ${payload.repository_id}`);
            core.info(`OIDC repository_owner: ${payload.repository_owner}`);
            core.info(`OIDC repository_owner_id: ${payload.repository_owner_id}`);
            core.info(`OIDC ref: ${payload.ref}`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate SAM template
        run: sam validate --lint

      - name: Build SAM application
        run: sam build

      - name: Deploy
        run: |
          sam deploy \
            --stack-name "${{ vars.APPLICATION_STACK_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --s3-bucket "${{ vars.SAM_ARTIFACT_BUCKET }}" \
            --role-arn "${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset